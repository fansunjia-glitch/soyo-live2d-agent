name: SoyoCompanion
options:
  bundleIdPrefix: com.soyo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SoyoCompanion:
    type: application
    platform: iOS
    sources:
      - path: SoyoCompanion
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soyo.companion
        PRODUCT_NAME: Soyo Companion
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SoyoCompanion/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - SoyoCompanionTests
  SoyoCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoyoCompanionTests
    dependencies:
      - target: SoyoCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soyo.companion.tests
